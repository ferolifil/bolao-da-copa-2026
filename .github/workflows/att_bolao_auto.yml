name: Update Bolão da Copa Data - Auto

on:
  schedule:
    - cron: '2 * * * *' # Every hour at minute 15

jobs:
  att_bolao:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run etl
      env:
        GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        INPUT_SPREADSHEETS: ${{ vars.INPUT_SPREADSHEETS }}
        OUTPUT_SPREADSHEETS: ${{ vars.OUTPUT_SPREADSHEETS }}
      run: python main.py

  # on:
  #   schedule:
  #     - cron: '15 * * * *'  # Every hour at minute 15
  #   workflow_dispatch:  # Allow manual trigger